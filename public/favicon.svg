<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00cc52"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle neon border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#00ff66" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Radial ambient green light -->
  <circle cx="256" cy="256" r="160" fill="#00ff66" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Nexium "N" Monogram with High-Tech Trading Edge -->
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <path d="M 140 130 L 195 130 L 195 382 L 140 382 Z" fill="url(#neonGreen)"/>
    
    <!-- Diagonal trading stroke -->
    <path d="M 190 130 L 322 382 L 372 382 L 240 130 Z" fill="url(#neonGreen)"/>
    
    <!-- Right vertical bar -->
    <path d="M 317 130 L 372 130 L 372 382 L 317 382 Z" fill="url(#neonGreen)"/>

    <!-- Dynamic Pulse Node / Spike Dot -->
    <circle cx="372" cy="140" r="16" fill="#ffffff"/>
    <circle cx="140" cy="372" r="14" fill="#00ff66"/>
  </g>
</svg>
