name: Auto Deploy Nexium Markets to OVH VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to OVH Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote VPS Deployment
        uses: appleboy/ssh-action@master
        with:
          host: 149.56.97.158
          username: ubuntu
          key: ${{ secrets.VPS_SSH_DEPLOY_KEY }}
          port: 22
          script: |
            echo "🚀 Lancement du déploiement automatique sur le VPS OVH..."
            /home/ubuntu/deploy.sh
            echo "✅ Déploiement terminé avec succès sur https://nexiummarkets.com !"
